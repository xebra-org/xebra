name: Deploy Convex

# Pushes apps/web/convex to the production Convex deployment whenever main changes it. Vercel
# deploys the web app from main, but not Convex: without this, a release that adds or changes a
# Convex function (a new table, a cron, a mutation the API calls by name) goes live on Vercel while
# Convex still runs the old code, and those calls fail until someone runs `npx convex deploy`.
#
# `packages/cctp-client` is watched too: `irisBudget.ts` imports it, and Convex bundles it inline
# from its `dist/` (see apps/web/convex/README.md), so a change there changes what Convex runs.
#
# Needs the repo secret CONVEX_DEPLOY_KEY: a production deploy key from the Convex dashboard
# (project → Settings → Deploy keys → Generate production deploy key). The deployment's own
# env vars (IRIS_BUDGET_SECRET, XEBRA_API_SECRET) live on Convex and are not touched here.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/convex/**"
      - "packages/cctp-client/**"
      - ".github/workflows/convex-deploy.yml"
  # For a first deploy, or to redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two deploys at once, and never cancel one halfway: the later run waits, then deploys
  # main as it stands.
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Convex production
    runs-on: ubuntu-latest
    steps:
      - name: The deploy key is set
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::The CONVEX_DEPLOY_KEY secret is not set. Generate a production deploy key in the Convex dashboard (Settings → Deploy keys) and add it in GitHub under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the web app (it carries the convex CLI) and its workspace packages, cctp-client among them.
      - run: pnpm install --frozen-lockfile --filter @xebra/web...

      - name: Build cctp-client (bundled inline by Convex)
        run: pnpm --filter @xebra/cctp-client build

      - name: Deploy
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy
